# ==============================================================
#  Configuración exclusiva de pruebas (H2 en memoria)
#  Se usa automáticamente al ejecutar `mvn test`
# ==============================================================

spring.application.name=ms-pedidos-tests

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:pedidos_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Esquema efímero: se crea al iniciar y se borra al terminar las pruebas
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Secreto de pruebas (no productivo) con el largo mínimo exigido
seguridad.jwt.secreto=clave-de-pruebas-para-el-micro-de-pedidos-1234567890

# Los clientes Feign son perezosos: ninguna prueba de contexto los invoca
integraciones.usuario.base-url=http://localhost:8099
integraciones.restaurante.base-url=http://localhost:8098
