# ==============================================================
#  PLAZOLETA DE COMIDAS · Microservicio de Pedidos
#  Puerto: 8082 · Base de datos: MySQL 8 (Docker)
#  Los valores sensibles NUNCA van aquí: llegan por entorno
# ==============================================================

spring.application.name=ms-pedidos
server.port=8082

# ---------- Conexión a la base de datos ----------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA / Hibernate ----------
# update: Hibernate crea o ajusta las tablas según las entidades,
# SIN borrar los datos que ya existen (ideal en desarrollo).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Descomenta para ver el SQL generado en consola:
# spring.jpa.show-sql=true

# ---------- Seguridad / Tokens JWT ----------
# Este microservicio NO emite tokens: solo valida la firma de los
# JWT que emite el microservicio de usuarios. El secreto debe ser
# EXACTAMENTE el mismo en todos los microservicios (mínimo 32 caracteres).
seguridad.jwt.secreto=${APP_JWT_SECRET}

# ---------- Integración con los otros microservicios ----------
# Usuarios: teléfono del cliente para el SMS del pedido listo (HU14).
integraciones.usuario.base-url=${USUARIO_API_URL:http://localhost:8080}
# Restaurantes: carta del plato (HU11), vínculo del empleado (HU12)
# y dueño del establecimiento (HU18).
integraciones.restaurante.base-url=${RESTAURANTE_API_URL:http://localhost:8081}
